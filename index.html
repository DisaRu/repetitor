<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Голосовой ассистент на ИИ</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2.5rem 2rem;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 25px 50px -8px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.06);
    }
    h1 {
      color: #f0f4ff;
      font-weight: 500;
      font-size: 1.9rem;
      margin-bottom: 0.25rem;
    }
    .sub {
      color: #8b9bb5;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid #5d7bff;
      padding-left: 0.75rem;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      color: #b0c4de;
      font-size: 0.9rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4a5a7a;
      transition: 0.3s;
    }
    .dot.recording {
      background: #ff4d6d;
      box-shadow: 0 0 16px #ff4d6d;
      animation: pulse 1.2s infinite;
    }
    .dot.thinking {
      background: #fbbf24;
      box-shadow: 0 0 16px #fbbf24;
      animation: pulse 1s infinite;
    }
    .dot.speaking {
      background: #34d399;
      box-shadow: 0 0 16px #34d399;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #d6e0f0;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      flex: 0 1 auto;
    }
    .btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .btn-primary {
      background: #5d7bff;
      border-color: #5d7bff;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: #6f8aff;
      border-color: #6f8aff;
    }
    .btn-danger {
      background: #d14c6a;
      border-color: #d14c6a;
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) {
      background: #e05a7a;
      border-color: #e05a7a;
    }
    .btn-success {
      background: #059669;
      border-color: #059669;
      color: #fff;
    }
    .btn-success:hover:not(:disabled) {
      background: #10b981;
      border-color: #10b981;
    }
    .text-area {
      background: rgba(0,0,0,0.35);
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 1rem;
    }
    .text-area:focus-within {
      border-color: #5d7bff;
      box-shadow: 0 0 0 4px rgba(93,123,255,0.15);
    }
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e8edf5;
      font-size: 1.1rem;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
      min-height: 60px;
    }
    textarea::placeholder {
      color: #5a6a82;
      font-weight: 300;
    }
    .response-box {
      background: rgba(0,0,0,0.3);
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.05);
      min-height: 80px;
      color: #e8edf5;
      font-size: 1.1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .response-box .label {
      color: #8b9bb5;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #4f6180;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 1rem;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🎙️ Голосовой ассистент</h1>
  <div class="sub">Говорите → распознавание → ответ от ИИ → озвучка</div>

  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Готов</span>
    <span class="badge" style="background:#2b3550;padding:0.2rem 0.8rem;border-radius:20px;font-size:0.7rem;color:#b8cbff;">ИИ: Qwen2.5-3B</span>
  </div>

  <div class="row">
    <button class="btn btn-primary" id="recordBtn">🎙️ Записать</button>
    <button class="btn btn-danger" id="stopBtn" disabled>⏹ Стоп</button>
    <button class="btn btn-success" id="askBtn" disabled>🤖 Спросить ИИ</button>
    <button class="btn" id="speakBtn" disabled>🔊 Озвучить ответ</button>
    <button class="btn" id="clearBtn">🗑 Очистить</button>
  </div>

  <div class="text-area">
    <textarea id="outputText" placeholder="Здесь будет распознанный текст или вы можете ввести свой вопрос вручную..." rows="2"></textarea>
  </div>

  <div class="response-box" id="responseBox">
    <div class="label">Ответ ИИ:</div>
    <div id="responseText">Здесь появится ответ ассистента.</div>
  </div>

  <div class="footer-note">
    <span>Работает через ваш HF Space: <code>lasthomo-voice.hf.space</code></span>
  </div>
</div>

<script>
  (function() {
    // ===== Конфигурация =====
    const API_BASE = 'https://lasthomo-voice.hf.space';

    // ===== DOM элементы =====
    const output = document.getElementById('outputText');
    const responseDiv = document.getElementById('responseText');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const askBtn = document.getElementById('askBtn');
    const speakBtn = document.getElementById('speakBtn');
    const clearBtn = document.getElementById('clearBtn');

    // ===== Состояние =====
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordedBlob = null;          // последний записанный blob
    let lastUserText = '';            // последний распознанный или введённый текст
    let lastAssistantReply = '';      // последний ответ ИИ

    // ===== Функции статуса =====
    function setStatus(text, mode) {
      statusText.textContent = text;
      statusDot.className = 'dot';
      if (mode === 'recording') statusDot.classList.add('recording');
      else if (mode === 'thinking') statusDot.classList.add('thinking');
      else if (mode === 'speaking') statusDot.classList.add('speaking');
    }

    // ===== Работа с микрофоном и записью =====
    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          // Создаём blob
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          recordedBlob = blob;
          isRecording = false;
          recordBtn.disabled = false;
          stopBtn.disabled = true;
          // Если blob не пустой, отправляем на распознавание
          if (blob.size > 1000) {
            sendToSTT(blob);
          } else {
            setStatus('Речь не обнаружена', '');
          }
          // Останавливаем все треки
          stream.getTracks().forEach(t => t.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.disabled = true;
        stopBtn.disabled = false;
        askBtn.disabled = true;
        speakBtn.disabled = true;
        setStatus('🎤 Запись...', 'recording');
      } catch (err) {
        alert('Ошибка доступа к микрофону: ' + err.message);
        setStatus('❌ Ошибка микрофона', '');
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
      }
    }

    // ===== Отправка на STT =====
    async function sendToSTT(blob) {
      setStatus('⏳ Распознавание...', 'thinking');
      const formData = new FormData();
      formData.append('file', blob, 'recording.webm');

      try {
        const response = await fetch(`${API_BASE}/stt`, {
          method: 'POST',
          body: formData
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const text = data.text || '';
        if (text.trim()) {
          output.value = text;
          lastUserText = text;
          askBtn.disabled = false;   // разрешаем задать вопрос
          setStatus('✅ Распознано', '');
        } else {
          setStatus('⚠️ Не удалось распознать речь', '');
        }
      } catch (err) {
        console.error(err);
        setStatus('❌ Ошибка STT: ' + err.message, '');
      }
    }

    // ===== Отправка в /chat =====
    async function askAI() {
      const text = output.value.trim();
      if (!text) {
        alert('Введите текст или распознайте речь.');
        return;
      }
      lastUserText = text;
      askBtn.disabled = true;
      setStatus('🤖 Думает...', 'thinking');

      try {
        const payload = {
          message: text,
          history: []   // можно при желании хранить историю, но для простоты оставляем пустым
        };
        const response = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const reply = data.response || 'Нет ответа';
        lastAssistantReply = reply;
        responseDiv.textContent = reply;
        speakBtn.disabled = false;
        setStatus('✅ Ответ получен', '');
      } catch (err) {
        console.error(err);
        setStatus('❌ Ошибка ИИ: ' + err.message, '');
      } finally {
        askBtn.disabled = false;
      }
    }

    // ===== Озвучивание через SpeechSynthesis (локально) =====
    function speakReply() {
      const text = lastAssistantReply || responseDiv.textContent;
      if (!text || text === 'Здесь появится ответ ассистента.') {
        alert('Нет текста для озвучивания.');
        return;
      }
      if (!window.speechSynthesis) {
        alert('Ваш браузер не поддерживает синтез речи.');
        return;
      }
      // Отменяем текущую речь
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      utterance.volume = 1;
      utterance.onstart = () => setStatus('🔊 Говорит...', 'speaking');
      utterance.onend = () => setStatus('✅ Готов', '');
      utterance.onerror = (e) => {
        console.warn('SpeechSynthesis error:', e);
        setStatus('⚠️ Ошибка озвучки', '');
      };
      window.speechSynthesis.speak(utterance);
    }

    // ===== Очистка =====
    function clearAll() {
      output.value = '';
      responseDiv.textContent = 'Здесь появится ответ ассистента.';
      lastUserText = '';
      lastAssistantReply = '';
      askBtn.disabled = true;
      speakBtn.disabled = true;
      setStatus('Готов', '');
      if (window.speechSynthesis && window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }
    }

    // ===== Обработчики кнопок =====
    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    askBtn.addEventListener('click', askAI);
    speakBtn.addEventListener('click', speakReply);
    clearBtn.addEventListener('click', clearAll);

    // Если пользователь вводит текст вручную, разрешаем кнопку "Спросить ИИ"
    output.addEventListener('input', function() {
      const val = this.value.trim();
      if (val) {
        askBtn.disabled = false;
        lastUserText = val;
      } else {
        askBtn.disabled = true;
      }
    });

    // Инициализация
    setStatus('Готов', '');
    stopBtn.disabled = true;
    askBtn.disabled = true;
    speakBtn.disabled = true;
  })();
</script>
</body>
</html>
